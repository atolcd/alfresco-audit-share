services:
  audit-share-share:
    image: alfresco-share-audit-share:development
    build:
      dockerfile: ./Dockerfile
      context: ../../../audit-share-share-docker/target
    environment:
      CATALINA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8888"
      REPO_HOST: audit-share-acs
      REPO_PORT: 8080
    ports:
      - "${share.port}:8080"
      - "${share.debug.port}:8888"

  audit-share-acs:
    image: alfresco-content-services-audit-share:development
    build:
      dockerfile: ./Dockerfile
      context: ../../../audit-share-platform-docker/target
    environment:
      JAVA_TOOL_OPTIONS: "${keystore.settings}"
      OVERRIDE_JAVA_OPTS: ""
      JAVA_OPTS: "
        -Dalfresco.cross.locale.datatype.0={http://www.alfresco.org/model/dictionary/1.0}text
        -Dalfresco.cross.locale.datatype.1={http://www.alfresco.org/model/dictionary/1.0}content
        -Dalfresco.cross.locale.datatype.2={http://www.alfresco.org/model/dictionary/1.0}mltext
        -Dalfresco.cross.locale.property.0={http://www.alfresco.org/model/content/1.0}content
        -Delasticsearch.index.locale=fr
        $$OVERRIDE_JAVA_OPTS
      "
      CATALINA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8888"
    ports:
      - "${acs.port}:8080"
      - "${acs.debug.port}:8888"
    volumes:
      - audit-share-acs-volume:/usr/local/tomcat/alf_data
    depends_on:
      - audit-share-postgres

  audit-share-postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "${postgres.port}:5432"
    volumes:
      - audit-share-db-volume:/var/lib/postgresql/data

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:${docker.transform-core.version}
    environment:
      JAVA_OPTS: "
        -Xms512m -Xmx1024m
        -Dserver.tomcat.threads.max=12
        -Dserver.tomcat.threads.min=4
        -Dlogging.level.org.alfresco.transform.common.TransformerDebug=ERROR"
      ACTIVEMQ_URL: "nio://activemq:61616"
      ACTIVEMQ_USER: "admin"
      ACTIVEMQ_PASSWORD: "admin"
      FILE_STORE_URL: "http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file"
    ports:
      - "8090:8090"
    links:
      - activemq

  # Block to comment in Community version
  # transform-router:
  #   image: quay.io/alfresco/alfresco-transform-router:${docker.transform-routeur.version}
  #   environment:
  #     JAVA_OPTS: " -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
  #     ACTIVEMQ_USER=admin
  #     ACTIVEMQ_PASSWORD=admin
  #     ACTIVEMQ_URL: "nio://activemq:61616"
  #     CORE_AIO_URL : "http://transform-core-aio:8090"
  #     FILE_STORE_URL: "http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file"
  #   ports:
  #     - 8095:8095
  #   links:
  #     - activemq

  shared-file-store:
    image: quay.io/alfresco/alfresco-shared-file-store:${docker.sfs.version}
    # Community : alfresco/alfresco-shared-file-store:0.16.1
    environment:
      JAVA_OPTS: " -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
      scheduler.content.age.millis: 86400000
      scheduler.cleanup.interval: 86400000
    ports:
      - 8099:8099
    volumes:
      - audit-share-sfs-data:/tmp/Alfresco/sfs

  activemq:
    image: ${docker.activemq.image}:${docker.activemq.version}
    ports:
      - 8161:8161 # Web Console
      - 5672:5672 # AMQP
      - 61616:61616 # OpenWire
      - 61613:61613 # STOMP
    volumes:
      - audit-share-amq_conf:/opt/activemq/conf
      - audit-share-amq_data:/opt/activemq/data
      - audit-share-amq_logs:/var/log/activemq
      
  elasticsearch:
    image: elasticsearch:${alfresco.es.version}
    environment:
        ELASTICSEARCH_CREATEINDEXIFNOTEXISTS: true
        INDEX_SUBSYSTEM_NAME: elasticsearch
        ELASTICSEARCH_HOST: elasticsearch
        ELASTICSEARCH_INDEXNAME: alfresco
        ELASTICSEARCH_BASEURL: /
        ELASTICSEARCH_SECURECOMMS: none
        ELASTIC_PASSWORD: elastic
        xpack.security.enabled: true
        xpack.security.authc.api_key.enabled: true
        discovery.type: single-node
    deploy:
      resources:
        limits:
          memory: 4G
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - audit-share-es-volume:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"

  live-indexing:
    image: quay.io/alfresco/alfresco-elasticsearch-live-indexing:${alfresco.es.indexing.version}
    # Community : alfresco/alfresco-elasticsearch-batch-indexing:${alfresco.es.indexing.version}
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      JAVA_OPTS: "
        -Dfile.encoding=utf-8
        -Dalfresco.cross.locale.datatype.0={http://www.alfresco.org/model/dictionary/1.0}text
        -Dalfresco.cross.locale.datatype.1={http://www.alfresco.org/model/dictionary/1.0}content
        -Dalfresco.cross.locale.datatype.2={http://www.alfresco.org/model/dictionary/1.0}mltext
        -Dalfresco.cross.locale.property.0={http://www.alfresco.org/model/content/1.0}content
      "
      ELASTICSEARCH_INDEXNAME: alfresco
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_REST_USERNAME: elastic
      SPRING_ELASTICSEARCH_REST_PASSWORD: elastic #pragma: allowlist secret
      SPRING_ACTIVEMQ_BROKERURL: nio://activemq:61616
      SPRING_ACTIVEMQ_USER: admin
      SPRING_ACTIVEMQ_PASSWORD: admin #pragma: allowlist secret
      ALFRESCO_SHAREDFILESTORE_BASEURL: http://shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file/
      ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL: http://transform-core-aio:8090/transform/config
    ports:
      - "8190:8190"
      - "7654:8080"
    depends_on:
      - elasticsearch
      - audit-share-postgres
      - audit-share-acs

  # Block to comment in Community version
  reindexing:
    image: quay.io/alfresco/alfresco-elasticsearch-reindexing:${alfresco.es.indexing.version}
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      JAVA_OPTS: "
        -Dfile.encoding=utf-8
      "
    env_file:
      - ./files/env/re-indexing.env

volumes:
  audit-share-acs-volume:
    external: true
  audit-share-db-volume:
    external: true
  audit-share-es-volume:
    external: true
  audit-share-amq_conf:
    external: true
  audit-share-amq_data:
    external: true
  audit-share-amq_logs:
    external: true
  audit-share-sfs-data:
     driver_opts:
       type: tmpfs
       device: tmpfs
